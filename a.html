<!DOCTYPE html>
<html lang="tr">
<meta charset="UTF-8">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#222;
  color:white;
  text-align:center;
}

.container{
  display:grid;
  grid-template-columns:repeat(5,80px);
  gap:8px;
  justify-content:center;
  margin-top:30px;
}

.card{
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:#555;
  cursor:pointer;
}
</style>

<div class="container" id="game"></div>

<script>
let fruits=[
"🍎","🍎",
"🍌","🍌",
"🍇","🍇",
"🍓","🍓",
"🍉","🍉",
"🍒","🍒",
"🍍","🍍",
"🍑","🍑",
"🥝","🥝",
"🍊","🍊"
];

fruits.sort(()=>Math.random()-0.5);

let first=null;
let lock=false;

fruits.forEach(f=>{
  let c=document.createElement("div");
  c.className="card";
  c.dataset.fruit=f;

  c.onclick=()=>{

    if(lock || c.innerText) return;

    c.innerText=f;

    if(!first){
      first=c;
    }else{

      if(first.dataset.fruit===c.dataset.fruit){
        first=null;
      }else{
        lock=true;
        setTimeout(()=>{
          first.innerText="";
          c.innerText="";
          first=null;
          lock=false;
        },400);
      }
    }
  };

  game.appendChild(c);
});
</script>
</html>
