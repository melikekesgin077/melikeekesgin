<!DOCTYPE html>
<html lang="tr">
<meta charset="UTF-8">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#2c3e50;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:10px;
  width:260px;
  text-align:center;
}

input{
  width:90%;
  padding:8px;
  margin:5px 0;
}

button{
  width:95%;
  padding:8px;
  margin-top:5px;
  cursor:pointer;
}

.home{
  display:none;
  text-align:center;
}
</style>

<div class="box" id="formBox">

  <h3>Bilgilerinizi Girin</h3>

  <input id="name" placeholder="İsim giriniz">
  <input id="surname" placeholder="Soyad giriniz">

  <button onclick="save()">Kaydet</button>

</div>

<div class="box home" id="homeBox">
  <h2>Hoş geldin 🎉</h2>
  <p id="text"></p>

  <button onclick="back()">Ana Sayfaya Dön</button>
</div>

<script>
function save(){
  let name=document.getElementById("name").value;
  let surname=document.getElementById("surname").value;

  document.getElementById("formBox").style.display="none";
  document.getElementById("homeBox").style.display="block";

  document.getElementById("text").innerText =
  "İsim: " + name + " | Soyad: " + surname;
}

function back(){
  document.getElementById("formBox").style.display="block";
  document.getElementById("homeBox").style.display="none";

  document.getElementById("name").value="";
  document.getElementById("surname").value="";
}
</script>

</html>
